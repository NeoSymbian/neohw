# SPDX-License-Identifier: Apache-2.0
# neohw host workspace: the hardware's user-side crates (protocols, IPC contracts, sans-I/O state machines), no_std +
# alloc, unit-tested on the Mac with `cargo test`. The Symbian EXEs are in symbian/, its own workspace built only for
# armv5te-none-eabi (`cargo arm`). Overview: docs hardware.md.
[workspace]
members = [
    "crates/ext4ro",
    "crates/modem-ipc",
    "crates/apr",
    "crates/qrtr",
    "crates/hub-ipc",
    "crates/hub",
    "crates/modem",
    "crates/neoaudio",
    "crates/net",
    "crates/phone-rules",
    "crates/sms",
    "crates/wifi",
    "crates/wlfw",
    "crates/wpa",
]
resolver = "2"
