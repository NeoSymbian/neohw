[package]
name = "modem-proto"
description = "QRTR, QMI and the modem's apps-side services (rmtfs, service locator, TFTP) for NeoSymbian"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
modem-ipc = { path = "../modem-ipc" }
neoaudio = { path = "../neoaudio" }
phone-rules = { path = "../phone-rules" }
sms = { path = "../sms" }
# the Wi-Fi firmware's QMI client; MODEMD drives it because it owns the modem's QRTR link
wlfw = { path = "../wlfw" }
