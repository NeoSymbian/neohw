# SPDX-License-Identifier: Apache-2.0
[package]
name = "net"
description = "NeoNet: the IP stack over Wi-Fi (smoltcp: DHCP, DNS, TCP) and its IPC protocol and client (docs hardware/wifi.md W5)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# The client side of the NeoNet IPC API (e32 sessions): for SYSSTART and apps, built for the phone.
client = ["dep:e32"]

[dependencies]
# shortcut: IPv4 only (no proto-ipv6), add it when an IPv6-only network matters
smoltcp = { version = "0.14", default-features = false, features = [
    "alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-tcp", "socket-udp", "socket-dhcpv4",
    "socket-dns", "auto-icmp-echo-reply",
] }
# smoltcp's heapless goes through portable-atomic (native ARMv8 atomics since US4; the critical-section backend, e32's
# kernel mutex, is only its fallback), as Slint's do in neoui.
heapless = { version = "0.9", default-features = false, features = ["portable-atomic-critical-section"] }
# NeoSymbian/e32-rs, the same revision as neoui (one e32 in SYSSTART)
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "206b6c28cf49ef2f6e746580df97f05921500c35", optional = true }
