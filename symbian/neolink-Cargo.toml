# The Symbian side: NEONET.EXE as a staticlib for build/emitter/build_rust_exe.py (exes.txt). Its own workspace:
# built only for armv5te-none-eabi with the pinned nightly (`cargo arm`), like telephony/symbian.
[workspace]
members = ["neonet"]
resolver = "2"

[workspace.dependencies]
# NeoSymbian/e32-rs, the same revision as neoui
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "0489694ee55f6879a0f769d1e6d17077b22d4e32", features = ["critical-section"] }
net = { path = "../crates/net" }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
